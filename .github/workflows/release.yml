name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (tag), e.g. v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p release
          cp artifacts/SuperMarioBros-Android/*.apk "release/SuperMarioBros-$VERSION-Android.apk"
          (cd artifacts/SuperMarioBros-Windows && zip -9 "../../release/SuperMarioBros-$VERSION-Windows.zip" SuperMarioBros.exe)
          chmod +x artifacts/SuperMarioBros-Linux/SuperMarioBros
          tar -C artifacts/SuperMarioBros-Linux -czf "release/SuperMarioBros-$VERSION-Linux.tar.gz" SuperMarioBros
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Super Mario Bros. ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            Native C++ port of Super Mario Bros. for Android, Windows and Linux.

            A ROM is required and is not included: **Super Mario Bros. (World)** or **Super Mario Bros. / Duck Hunt (USA)**.

            | File | Platform |
            |------|----------|
            | `SuperMarioBros-${{ inputs.version }}-Android.apk` | Android 8.0+ (arm64-v8a) |
            | `SuperMarioBros-${{ inputs.version }}-Windows.zip` | Windows x64 |
            | `SuperMarioBros-${{ inputs.version }}-Linux.tar.gz` | Linux x64 |
